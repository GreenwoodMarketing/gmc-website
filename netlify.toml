[[redirects]]
  from = "/blog-4-1/the-product-marketing-documents-every-company-needs-and-how-to-actually-use-them"
  to = "/blog/product-marketing-documents"
  status = 301

[[redirects]]
  from = "/blog-4-1"
  to = "/blog/"
