[build]
  publish = "website"

[build.environment]
  NODE_VERSION = "18"

# Retired pages and old Squarespace addresses
[[redirects]]
  from = "/work"
  to = "/about"
  status = 301

[[redirects]]
  from = "/work.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/blog-4-1"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog-4-1/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
