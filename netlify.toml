[build]
  publish = "website"

[build.environment]
  NODE_VERSION = "18"

# Retired pages and old Squarespace addresses
[[redirects]]
  from = "/work"
  to = "/about"
  status = 301

[[redirects]]
  from = "/work.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/services-2"
  to = "/services"
  status = 301

[[redirects]]
  from = "/healthtech"
  to = "/services/healthcare-entry"
  status = 301

[[redirects]]
  from = "/healthtech-1"
  to = "/services/healthcare-entry"
  status = 301

[[redirects]]
  from = "/blog-4-1/powerofpersonalization"
  to = "/blog/personalized-marketing-strategies"
